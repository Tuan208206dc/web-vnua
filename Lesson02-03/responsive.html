<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive</title>
    <style>
      /* PC */
      /* PC width >= 1024 -> min-width */

      /* tablet  */
      /* width >= 740 và width < 1024 */
      /* min-widh: 740px , max-width: 1023px */

      /* mobile  */
      /* max-width: 739px */

      body {
        background-color: rgb(17, 196, 216);
        display: flex;
        height: 100vh;
        line-height: 100vh;
      }
      .mobile,
      .tablet,
      .pc {
        color: blue;
        font-size: 100px;
        display: none;
        margin: 0 auto;
      }
      @media screen and (min-width: 1024px) {
        .pc {
          display: block;
        }
      }
      @media screen and (max-width: 1023px) and (min-width: 740px) {
        .tablet {
          display: block;
        }
      }
      @media screen and (max-width: 739px) {
        .mobile {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <h2 class="mobile">Mobile</h2>
    <h2 class="tablet">Tablet</h2>
    <h2 class="pc">PC</h2>
  </body>
</html>
